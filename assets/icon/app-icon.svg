  <circle cx="723" cy="608" r="9" fill="#FFFFFF"/>
  <path d="M630 670 Q 665 715 700 670" fill="none" stroke="#3D2C5E" stroke-width="14" stroke-linecap="round"/>

  <!-- Wheels -->
