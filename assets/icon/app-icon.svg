    <circle cx="270" cy="830" r="88" fill="#4E342E"/><circle cx="270" cy="830" r="70" fill="#EF5350"/><circle cx="270" cy="830" r="20" fill="#4E342E"/>
    <circle cx="500" cy="830" r="88" fill="#4E342E"/><circle cx="500" cy="830" r="70" fill="#EF5350"/><circle cx="500" cy="830" r="20" fill="#4E342E"/>
    <circle cx="745" cy="852" r="60" fill="#4E342E"/><circle cx="745" cy="852" r="46" fill="#EF5350"/><circle cx="745" cy="852" r="15" fill="#4E342E"/>
