  <circle cx="575" cy="672" r="26" fill="#FF8AC6" opacity="0.7"/>
  <circle cx="755" cy="672" r="26" fill="#FF8AC6" opacity="0.7"/>
  <ellipse cx="615" cy="620" rx="22" ry="28" fill="#3D2C5E"/>
  <ellipse cx="715" cy="620" rx="22" ry="28" fill="#3D2C5E"/>
